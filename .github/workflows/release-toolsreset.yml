name: Release ToolsReset

# Тег вида toolsreset-v1.0 -> сборка установщика и релиз с ним.
on:
  push:
    tags:
      - 'toolsreset-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать установщик
        shell: pwsh
        run: ./Git/ToolsReset/build.ps1

      - name: Проверить, что payload распаковывается в исходный json
        shell: pwsh
        run: |
          $lines = [IO.File]::ReadAllLines('Git/ToolsReset/dist/ToolsReset-Installer.bat')
          $b64 = ($lines | Where-Object { $_ -like 'set "P=%P%*' } |
                  ForEach-Object { $_.Substring(10, $_.Length - 11) }) -join ''
          if (-not $b64) { throw 'В собранном установщике нет payload' }
          $decoded = [Convert]::FromBase64String($b64)
          $source  = [IO.File]::ReadAllBytes('Git/ToolsReset/custom-commands.json')
          if (-not [Linq.Enumerable]::SequenceEqual([byte[]]$decoded, [byte[]]$source)) {
            throw 'Вшитый json не совпадает с исходным'
          }
          Write-Host "payload ok ($($decoded.Length) байт)"

      - name: Создать релиз
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace '^refs/tags/', '' } else { "toolsreset-dev-$env:GITHUB_RUN_NUMBER" }
          $notes = @"
          Установщик команд Soft Reset для Fork.

          Скачайте ``ToolsReset-Installer.bat`` и запустите — больше ничего не нужно,
          ``custom-commands.json`` уже внутри файла.

          Подробности и видео: [README](https://github.com/${env:GITHUB_REPOSITORY}#toolsreset--soft-reset-для-fork)
          "@
          gh release create $tag 'Git/ToolsReset/dist/ToolsReset-Installer.bat' `
            --title "ToolsReset $tag" --notes $notes
